name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
      - name: Tipos
        run: npm run tipos
      - name: Analisis estatico
        run: npm run lint
      - name: Pruebas
        run: npm run prueba
